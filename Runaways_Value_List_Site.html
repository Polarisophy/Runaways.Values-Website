<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runaways Value List</title>
<style>
:root{
  --navy:#0F172A; --slate:#1F2937; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --card:#FFFFFF; --bg:#F3F5F8; --accent:#2563EB; --accent-soft:#DBEAFE;
  --m:#C00000; --l:#E0409F; --e:#7030A0; --r:#2F75B5; --c:#3F8F2E;
  --cat-s:#1D4ED8; --cat-w:#0F766E;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root:not([data-theme="light"]){ }
:root[data-theme="dark"]{
  --navy:#0B1220; --card:#161E2E; --bg:#0B0F17; --ink:#F1F5F9; --muted:#94A3B8; --line:#25314A;
  --accent-soft:#1E3A63;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0B1220; --card:#161E2E; --bg:#0B0F17; --ink:#F1F5F9; --muted:#94A3B8; --line:#25314A;
    --accent-soft:#1E3A63;
  }
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body, header.top, nav.tabs, .tab, .card, .thumb, #search, #sort, .credits, .status, .row .v, #themeBtn{
  transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
}
body{
  margin:0; background:var(--bg); color:var(--ink);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:
    linear-gradient(45deg, rgba(0,0,0,.025) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.025) 75%),
    linear-gradient(45deg, rgba(0,0,0,.025) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.025) 75%);
  background-size: 28px 28px; background-position: 0 0, 14px 14px;
}
header.top{
  background:var(--navy); padding-top:calc(env(safe-area-inset-top,0px) + 18px); padding-bottom:14px;
}
.top-inner{max-width:1180px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between;}
.brand{display:flex; align-items:baseline; gap:9px;}
.brand b{color:#fff; font-size:18px; letter-spacing:.2px;}
.brand span{color:#94A3B8; font-size:12px;}
#themeBtn{
  width:34px; height:34px; border-radius:50%; border:1px solid #2A3752; background:#161F30;
  color:#E2E8F0; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
nav.tabs{background:var(--card); border-bottom:1px solid var(--line);}
.tabs-inner{max-width:1180px; margin:0 auto; padding:0 24px; display:flex; gap:6px;}
.tab{
  border:none; background:none; padding:14px 16px; font-size:13.5px; font-weight:600;
  color:var(--muted); cursor:pointer; border-radius:8px 8px 0 0; letter-spacing:.2px;
}
.tab.active{color:var(--accent); background:var(--accent-soft);}
main{max-width:1180px; margin:0 auto; padding:22px 24px 60px;}
.toolbar{display:flex; gap:12px; margin-bottom:6px; flex-wrap:wrap;}
#search{
  flex:1; min-width:220px; padding:11px 16px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-size:14px; outline:none;
}
#search:focus{border-color:var(--accent);}
#sort{
  padding:11px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); font-size:13.5px; font-weight:500; outline:none;
}
.count{color:var(--muted); font-size:12.5px; margin:12px 2px 16px;}
.grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:16px;
}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
  display:flex; flex-direction:column;
}
.thumb{
  aspect-ratio:1; background:
    linear-gradient(135deg, rgba(0,0,0,.02), rgba(0,0,0,.05));
  display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px;
}
.body{padding:13px 14px 14px;}
.name{font-weight:700; font-size:14.5px; margin:0 0 9px; line-height:1.3;}
.row{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; margin-bottom:3px;}
.row .k{color:var(--muted);}
.row .v{font-weight:600;}
.status{
  margin-top:9px; padding-top:9px; border-top:1px solid var(--line);
  display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700;
}
.dot{width:7px; height:7px; border-radius:50%; flex:none;}
.empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 20px; font-size:14px;}
.credits{max-width:560px; margin:40px auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:34px 30px; text-align:center;}
.credits h2{margin:0 0 10px; font-size:19px;}
.credits p{color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 6px;}
.credits b{color:var(--ink);}
.discord-btn{
  display:inline-flex; align-items:center; gap:9px; margin-top:18px; padding:11px 20px;
  background:#5865F2; color:#fff; text-decoration:none; font-weight:600; font-size:13.5px;
  border-radius:10px; transition:background-color .2s ease, transform .2s ease;
}
.discord-btn:hover{background:#4752C4; transform:translateY(-1px);}
.discord-btn:active{transform:translateY(0);}
#view-database, #view-credits{
  transition: opacity .28s ease, transform .28s ease;
  opacity:1; transform:translateY(0);
}
#view-database.hidden, #view-credits.hidden{
  display:none;
}
#view-database.leaving, #view-credits.leaving{
  opacity:0; transform:translateY(6px);
}
#themeBtn{transition: transform .35s ease, background-color .35s ease, color .35s ease;}
#themeBtn.spin{transform:rotate(180deg);}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand"><b>RUNAWAYS</b><span>Value List</span></div>
    <button id="themeBtn" aria-label="Toggle theme" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner">
    <button class="tab active" id="tabDatabase" onclick="showView('database')">DATABASE</button>
    <button class="tab" id="tabCredits" onclick="showView('credits')">CREDITS</button>
  </div>
</nav>

<main>
  <div id="view-database">
    <div class="toolbar">
      <input id="search" type="text" placeholder="Search database..." oninput="render()">
      <select id="sort" onchange="render()">
        <option value="default">Default Sort</option>
        <option value="valuedesc">Most Valuable First</option>
        <option value="valueasc">Least Valuable First</option>
      </select>
    </div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="view-credits" class="hidden">
    <div class="credits">
      <h2>Credits</h2>
      <p>Official List Made By <b>@Polarisophy</b>, All Data Reserved!</p>
      <p>Values shown are community estimates and may change over time.</p>
      <a class="discord-btn" href="https://discord.gg/XUDGKSEar" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 127.14 96.36" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
        <span>Join the Discord</span>
      </a>
    </div>
  </div>
</main>

<script>
const ITEMS = [["Vintage Minigun","S","M"],["Sniper Angel","S","M"],["Guardian Sniper","W","M"],["Spirited - AK","W","M"],["Aura - M4","W","M"],["Watching - Minigun","W","M"],["Cyber","W","M"],["Senso - Sniper, Knuckle, M4","W","M"],["Shroom Mace - Mace","S","L"],["Bronze Egg Pan - Pan","S","L"],["Club Sandwich - Bat","S","L"],["RPG7 Plunger - RPG7","S","L"],["Leaves -  MAC, Shotgun","W","L"],["Bloxking - RPG7, Pistol","W","L"],["Slimy - Machete, Revolver","W","L"],["Slimy Dots - Bat, Axe","W","L"],["Sushi Plate - GrndLauncher, Pan","W","L"],["Dots - Mace, Flamethrower","W","L"],["Cataback","W","L"],["Cool Money","W","L"],["Golden","W","L"],["Nebula","W","L"],["Tactical Navy","W","L"],["Black Vein","W","L"],["Rainy Day","W","L"],["Eternal Flame","W","L"],["Stop axe - Axe","S","E"],["Bulldog shotgun - Shotgun","S","E"],["Mac Tactical - MAC","S","E"],["Banana Glock - Pistol","S","E"],["Modern Flamethrower - Flamethr.","S","E"],["Scale fur - Sniper, Sawoff, M4","S","E"],["Hitmarker - Machete, Knuckl. RPG","W","E"],["Matrix  - Sawoff, GrndLaun. Pistol","W","E"],["Roman Tile - AK, Minigun, Mace","W","E"],["Honeycomb - ShotG. Revolv. Axe","W","E"],["Checker - Flamethrw. Knuckle, Bat","W","E"],["Web - Crowbar, Knuckle, Machete","W","E"],["Cats - Sniper, Knuckle, Machete","W","E"],["Koi Pond - SawedOff, Pan, RPG7","W","E"],["Cube - Crowbar, ShotG. GrndLau.","W","E"],["Glow Lava","W","E"],["Mac n Cheese","W","E"],["Web Hole","W","E"],["Tennis Racket - Pan","S","R"],["Crowbar Plack Taped - Crowbar","S","R"],["Pipe Wrench - Crowbar","S","R"],["Revolver Strong - Revolver","S","R"],["Shredder - Pistol","S","R"],["Sniper Tactical - Sniper","S","R"],["Damascus - Knunkl. ShotG. Revol.","W","R"],["Maze - AK, GranadeLauncher, Axe","W","R"],["Cracked - Minigun, Crowbar, M4","W","R"],["Curvy Line - Knuckl. ShotG. Revolver","W","R"],["Wave Stripes - Minigun, Pistol, MAC","W","R"],["Mountain - AK, SawedOff, Machete","W","R"],["Warnings - Flamethrwr. RPG7, Mace","W","R"],["Breakfast - Pan, Pistol, Sniper","W","R"],["Swiss Cheese - Bat, AK, Shotgun","W","R"],["Rainbow Paint - GrndL. Pistl. Crowb.","W","R"],["Triangle - Mace, Knuckle, RPG7","W","R"],["Cards - Flamethrower, AK, Machete","W","R"],["Picklish","W","R"],["Classic","W","R"],["XOXO","W","R"],["Pixelated","W","R"],["Carbon","W","R"],["All Stars","W","R"],["Knuckle Punk - Knuckle","S","C"],["Pickaxe - Mace","S","C"],["Viking Axe - Axe","S","C"],["Metal Pipe - Crowbar","S","C"],["Machette Serrated - Machete","S","C"],["Aztec Bat - Bat","S","C"],["Baby Revolver - Revolver","S","C"],["Moon - RPG, MiniG. Sniper, ShotG.","W","C"],["Empty Dots - Mace, M4, Pistol","W","C"],["Smokes - Sniper, RPG7, SawedOff","W","C"],["Eyes - Axe, AK, RPG7","W","C"],["Bubbles - Revolver, MiniG. Machete","W","C"],["Weaves - GrndL. Crowb. Axe. MAC","W","C"],["Weird Checker - Bat. RPG7, Pistol","W","C"],["Circles - Minigun, Shotgun, Axe","W","C"],["Mondrian - Pan, AK, Flamethrower","W","C"],["Tiki Pattern - Shotgun, M4, Machete","W","C"],["Scale - Crowbar, GrndLaun. Sawoff.","W","C"],["Wave - Pistol, Sniper, Mace","W","C"],["Flower - Pan, Sniper, Revolver","W","C"],["Polka Dot - SawOff. Flameth. Bat","W","C"],["Base Purple","W","C"],["Base Blue","W","C"],["Purple Fish","W","C"],["Red Camo","W","C"],["Sand Camo","W","C"],["Ice Camo","W","C"],["Jailbreak","W","C"],["Apex","W","C"]];
const CAT = {S:"Skin: Weapon", W:"Wrap"};
const CATCOLOR = {S:"var(--cat-s)", W:"var(--cat-w)"};
const RAR = {M:"Mythical", L:"Legendary", E:"Epic", R:"Rare", C:"Common"};
const RARCOLOR = {M:"var(--m)", L:"var(--l)", E:"var(--e)", R:"var(--r)", C:"var(--c)"};
const RARRANK = {M:5, L:4, E:3, R:2, C:1};

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const sort = document.getElementById('sort').value;
  let rows = ITEMS.map((it,i)=>({n:it[0], c:it[1], r:it[2], i}));
  if(q) rows = rows.filter(it => it.n.toLowerCase().includes(q));
  if(sort === 'valuedesc') rows.sort((a,b)=> RARRANK[b.r]-RARRANK[a.r] || a.n.localeCompare(b.n));
  else if(sort === 'valueasc') rows.sort((a,b)=> RARRANK[a.r]-RARRANK[b.r] || a.n.localeCompare(b.n));
  else rows.sort((a,b)=> a.i-b.i);

  document.getElementById('count').textContent = `Showing ${rows.length} of ${ITEMS.length} items`;
  const grid = document.getElementById('grid');
  if(rows.length === 0){
    grid.innerHTML = `<div class="empty">No items match "${escapeHtml(q)}".</div>`;
    return;
  }
  grid.innerHTML = rows.map(it => `
    <div class="card">
      <div class="thumb"></div>
      <div class="body">
        <p class="name">${escapeHtml(it.n)}</p>
        <div class="row"><span class="k">Category</span><span class="v" style="color:${CATCOLOR[it.c]}">${CAT[it.c]||it.c}</span></div>
        <div class="status"><span class="dot" style="background:${RARCOLOR[it.r]}"></span><span style="color:${RARCOLOR[it.r]}">${RAR[it.r]||it.r}</span></div>
      </div>
    </div>`).join('');
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showView(v){
  const dbEl = document.getElementById('view-database');
  const crEl = document.getElementById('view-credits');
  const showEl = v==='database' ? dbEl : crEl;
  const hideEl = v==='database' ? crEl : dbEl;
  document.getElementById('tabDatabase').classList.toggle('active', v==='database');
  document.getElementById('tabCredits').classList.toggle('active', v==='credits');

  if(hideEl.classList.contains('hidden')) { swapNow(); return; }
  hideEl.classList.add('leaving');
  window.setTimeout(swapNow, 220);

  function swapNow(){
    hideEl.classList.add('hidden');
    hideEl.classList.remove('leaving');
    showEl.classList.remove('hidden');
    showEl.classList.add('leaving');
    // force reflow so the transition below actually animates in
    void showEl.offsetWidth;
    showEl.classList.remove('leaving');
  }
}
function toggleTheme(){
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  let next;
  if(!cur){
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    next = prefersDark ? 'light' : 'dark';
  } else {
    next = cur === 'dark' ? 'light' : 'dark';
  }
  root.setAttribute('data-theme', next);
  const btn = document.getElementById('themeBtn');
  btn.classList.add('spin');
  window.setTimeout(()=>{
    btn.textContent = next === 'dark' ? '☀️' : '🌙';
    btn.classList.remove('spin');
  }, 175);
  try{ localStorage.setItem('rw-theme', next); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('rw-theme'); }catch(e){}
  if(saved){
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
  }
})();
render();
</script>
</body>
</html>
